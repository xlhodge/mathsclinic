name: Check past paper links
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, early morning
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-papers.mjs
