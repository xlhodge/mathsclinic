<style>
:root{--bg:#F6F7F4;--surface:#FFFFFF;--ink:#18212F;--muted:#5A6474;--line:#DEE2E6;--accent:#2946C4;--accent-ink:#FFFFFF;--accent-soft:#E7EBFB;--hl:#F7DC5C;--hl-ink:#3A3000;--g:#2E9D5B;--paper:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151C;--surface:#1A2029;--ink:#E7EAF0;--muted:#9AA3B2;--line:#2C3441;--accent:#8EA3FF;--accent-ink:#0E1430;--accent-soft:#232C4A;--hl:#C9AE2E;--hl-ink:#1D1800;--g:#5CC88A;--paper:#F3F3EF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151C;--surface:#1A2029;--ink:#E7EAF0;--muted:#9AA3B2;--line:#2C3441;--accent:#8EA3FF;--accent-ink:#0E1430;--accent-soft:#232C4A;--hl:#C9AE2E;--hl-ink:#1D1800;--g:#5CC88A;--paper:#F3F3EF;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px}
a{color:var(--accent)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
header.site{margin:0 -16px;padding:12px max(16px,calc((100vw - 1180px)/2));background:#18212F;border-bottom:3px solid #F7DC5C;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.site{background:#0B0F15}}
header.site .brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
header.site .logo{width:42px;height:42px;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
header.site h1{margin:0;color:#F3F5F8;font-size:1.55rem;line-height:1.1}
header.site h1 span{color:#F7DC5C}
header.site .byline{margin:0;color:#B7C0CE;font-size:.9rem;padding-left:14px;border-left:1px solid rgba(255,255,255,.18)}
main{max-width:1000px;margin:0 auto;padding-block:22px 60px}
.crumbs{margin:0 0 14px;font-size:.92rem}
.crumbs a{font-weight:700;text-decoration:none}
.kicker{margin:0;color:var(--muted);font-size:.9rem}
h2{margin:2px 0 4px;font-size:1.7rem;line-height:1.15}
.lead{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.lead b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{display:inline-flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 7px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip .t{display:flex;gap:8px;align-items:baseline;font-weight:700;font-size:.9rem;line-height:1.2}
.chip .n{font-weight:400;font-size:.78rem;color:var(--muted)}
.chip .m{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.chip .m i{display:block;height:100%;background:var(--g)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.85}
.chip[aria-pressed="true"] .m{background:color-mix(in srgb,var(--accent-ink) 35%,transparent)}
.chip[aria-pressed="true"] .m i{background:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chead{padding:12px 18px 12px;border-bottom:1px solid var(--line)}
.qpos{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);font-weight:700}
.qdots{display:inline-flex;gap:5px;flex-wrap:wrap}
.qdots button{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;padding:0;cursor:pointer}
.qdots button.done{background:var(--g);border-color:var(--g)}
.qdots button[aria-current="true"]{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.chead h3{margin:4px 0 2px;font-size:1.15rem;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.84rem;color:var(--muted)}
.pill{font-size:.75rem;font-weight:700;border-radius:99px;padding:1px 9px;border:1px solid var(--line)}
.pill.long{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));color:var(--accent);background:var(--accent-soft)}
.paper{background:var(--paper);padding:16px;overflow-x:auto;margin:14px 18px;border:1px solid color-mix(in srgb,var(--ink) 22%,var(--line));border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.paper.ms{margin-top:0}
.zoom{display:none;margin:6px 0 0;text-align:center;font-size:.8rem;color:#5A6474}
.paper img{display:block;max-width:100%;height:auto;margin:0 auto}
.paper.ms img{min-width:640px;max-width:none;width:100%}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:700;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn.gold{background:var(--hl);border-color:color-mix(in srgb,var(--hl) 70%,var(--ink));color:var(--hl-ink)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.donebtn{margin-left:auto}
.btn.donebtn[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.mshead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--hl) 14%,var(--surface));font-weight:700}
.mshead a{font-weight:400;font-size:.85rem}
.empty{padding:30px;text-align:center;color:var(--muted)}
footer{max-width:1000px;margin:0 auto;border-top:1px solid var(--line);padding-block:16px 30px;color:var(--muted);font-size:.82rem}
@media (max-width:640px){.chip{padding:5px 11px 6px}.chip .t{font-size:.84rem}.zoom{display:block}header.site .logo{width:36px;height:36px}header.site h1{font-size:1.3rem}h2{font-size:1.4rem}.acts .btn{flex:1 1 auto}.btn.donebtn{margin-left:0;flex:1 1 100%}.paper{padding:8px;margin:10px}}
</style>

ent","qw":1115,"qh":330,"mw":1632,"mh":1970,"sk":{"p-5":"Long questions","p-3":"Long questions"}},{"id":"c2-2012jan-q12","src":"C2 Jan 2012","q":12,"m":12,"ch":["p-10","p-11"],"long":true,"t":"Stationary points of 9x² − x⁴ and the area under it","qw":1117,"qh":381,"mw":1632,"mh":657,"sk":{"p-10":"Long questions","p-11":"Long questions"}},{"id":"c2-2012jan-q13","src":"C2 Jan 2012","q":13,"m":12,"ch":["r-2","p-6"],"long":true,"t":"Concert hall: sector areas and arc lengths","qw":1118,"qh":883,"mw":1632,"mh":798,"sk":{"r-2":"Long questions","p-6":"Long questions"}},{"id":"c3-2011june-q8","src":"C3 June 2011","q":8,"m":18,"ch":["r-9","r-10"],"long":true,"t":"Even function, f′(x), then area by substitution","qw":1119,"qh":870,"mw":1645,"mh":1015,"sk":{"r-9":"Long questions","r-10":"Long questions"}},{"id":"c3-2011june-q9","src":"C3 June 2011","q":9,"m":18,"ch":["r-9","r-10"],"long":true,"t":"Gradient of a sine curve, inverse function, area","qw":1119,"qh":955,"mw":1625,"mh":931,"sk":{"r-9":"Long questions","r-10":"Long questions"}},{"id":"c1-2011june-q11","src":"C1 June 2011","q":11,"m":11,"ch":["p-3","p-4"],"long":true,"t":"Curve and line intersection; completing the square","qw":1117,"qh":288,"mw":1646,"mh":992,"sk":{"p-3":"Long questions","p-4":"Long questions"}},{"id":"c2-2011june-q11","src":"C2 June 2011","q":11,"m":11,"ch":["p-10"],"long":true,"t":"Cylinder: maximum volume using calculus","qw":1118,"qh":391,"mw":1646,"mh":1012,"sk":{"p-10":"Long questions"}},{"id":"c1-2011june-q12","src":"C1 June 2011","q":12,"m":12,"ch":["p-8","p-7"],"long":true,"t":"Solving 4/x² = 2x + 5 graphically and with the factor theorem","qw":1118,"qh":987,"mw":1646,"mh":1141,"sk":{"p-8":"Long questions","p-7":"Long questions"}},{"id":"c2-2011june-q12","src":"C2 June 2011","q":12,"m":13,"ch":["r-3"],"long":true,"t":"Loan repayments: arithmetic and geometric series","qw":1118,"qh":558,"mw":1646,"mh":1007,"sk":{"r-3":"Long questions"}},{"id":"c1-2011june-q13","src":"C1 June 2011","q":13,"m":13,"ch":["p-5"],"long":true,"t":"Circle: axis intercepts and parallel tangents","qw":1119,"qh":994,"mw":1646,"mh":2014,"sk":{"p-5":"Long questions"}},{"id":"c2-2011june-q13","src":"C2 June 2011","q":13,"m":12,"ch":["r-2","p-6"],"long":true,"t":"Greenhouse: arc length, sector area and volume","qw":1118,"qh":875,"mw":1646,"mh":801,"sk":{"r-2":"Long questions","p-6":"Long questions"}}];
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
let ch=Object.keys(CH)[0], sk='all', i=0, showMs=false;
const slug=t=>t.toLowerCase().replace(/ˣ/g,'x').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const byMarks=(a,b)=>a.m-b.m||Q.indexOf(a)-Q.indexOf(b);
function inSkill(c,s){ return Q.filter(q=>q.sk[c]===s).sort(byMarks); }
function list(){ return sk==='all'?CH[ch].sk.flatMap(s=>inSkill(ch,s)):inSkill(ch,sk); }
function isDone(q){ return store.get('qdone:'+q.id)==='1'; }
function read(){ const h=decodeURIComponent(location.hash.slice(1)).split('/'); if(CH[h[0]]) ch=h[0]; sk=h[1]==='all'||/^\d+$/.test(h[1]||'')?'all':CH[ch].sk[0];
  let n=parseInt(h[1],10); const f=CH[ch].sk.find(s=>slug(s)===h[1]); if(f){ sk=f; n=parseInt(h[2],10); }
  else if(h[2]==='long'&&CH[ch].sk.includes('Long questions')) sk='Long questions';
  i=n>=1?n-1:0; }
function write(){ history.replaceState(null,'',`#${ch}/${sk==='all'?'all':slug(sk)}/${i+1}`); }
function chip(s,L){ const d=L.filter(isDone).length, pct=L.length?Math.round(100*d/L.length):0;
  return `<button class="chip" data-s="${s}" aria-pressed="${sk===s}"><span class="t">${s==='all'?'All':s}<span class="n">${d}/${L.length}</span></span>${d?`<span class="m" aria-hidden="true"><i style="width:${pct}%"></i></span>`:''}</button>`; }
function render(){
  const L=list(); if(i>=L.length) i=Math.max(0,L.length-1);
  const all=Q.filter(q=>q.ch.includes(ch)), done=all.filter(isDone).length;
  $('#title').textContent=CH[ch].name;
  $('#back').href='./#alevel-'+ch; $('#back').textContent='← Back to '+CH[ch].short;
  $('#lead').innerHTML=`<b>${all.length} exam questions</b> from MEI papers 2011 to 2018, grouped by skill, easiest first.${done?` You've done <b>${done}</b>.`:''} Do each one on paper, then check the mark scheme.`;
  $('#skills').innerHTML=CH[ch].sk.map(s=>chip(s,inSkill(ch,s))).join('')+(CH[ch].sk.length>1?chip('all',all):'');
  if(!L.length){ $('#card').innerHTML='<p class="empty">No questions for this skill yet.</p>'; write(); return; }
  const q=L[i];
  $('#card').innerHTML=`<div class="chead"><div class="qpos"><span>Question ${i+1} of ${L.length}</span><span class="qdots" aria-label="Jump to a question">${L.map((x,k)=>`<button class="${isDone(x)?'done':''}" aria-current="${k===i}" data-k="${k}" title="Question ${k+1}${isDone(x)?' (done)':''}" aria-label="Question ${k+1}"></button>`).join('')}</span></div>
  <h3>${q.t}</h3><div class="meta">${sk==='all'?`<span>${q.sk[ch]} ·</span>`:''}<span>MEI ${q.src} · Q${q.q} · ${q.m} marks</span>${q.long?'<span class="pill long">Long question</span>':''}</div></div>
  <div class="paper"><a href="q/${q.id}.png" target="_blank" rel="noopener" title="Open full size"><img src="q/${q.id}.png" width="${q.qw}" height="${q.qh}" alt="MEI ${q.src} question ${q.q}: ${q.t}"></a><p class="zoom">Tap the question to open it full size</p></div>
  ${showMs?`<div class="mshead"><span>Mark scheme</span><a href="q/${q.id}-ms.png" target="_blank" rel="noopener">Open full size &#8599;</a></div><div class="paper ms"><img src="q/${q.id}-ms.png" width="${q.mw}" height="${q.mh}" alt="Mark scheme for MEI ${q.src} question ${q.q}"></div>`:''}
  <div class="acts"><button class="btn" id="prev" ${i?'':'disabled'}>&larr; Previous</button><button class="btn gold" id="ms">${showMs?'Hide mark scheme':'Mark scheme'}</button><button class="btn" id="next" ${i<L.length-1?'':'disabled'}>Next &rarr;</button>
  <button class="btn donebtn" id="done" aria-pressed="${isDone(q)}">${isDone(q)?'Done &#10003;':'Mark as done'}</button></div>`;
  write();
}
function go(k){ i=k; showMs=false; render(); $('#card').scrollIntoView({block:'nearest'}); }
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.s){ sk=t.dataset.s; i=0; showMs=false; render(); if(innerWidth<=640) $('#card').scrollIntoView({behavior:'smooth',block:'start'}); }
  else if(t.dataset.k!==undefined) go(+t.dataset.k);
  else if(t.id==='prev') go(i-1);
  else if(t.id==='next') go(i+1);
  else if(t.id==='ms'){ showMs=!showMs; render(); }
  else if(t.id==='done'){ const q=list()[i]; store.set('qdone:'+q.id,isDone(q)?'':'1'); render(); }
});
document.addEventListener('keydown',e=>{ if(e.target.matches('input,select,textarea')) return; const L=list(); if(e.key==='ArrowRight'&&i<L.length-1) go(i+1); if(e.key==='ArrowLeft'&&i>0) go(i-1); });
window.addEventListener('hashchange',()=>{read();render();});
read(); render();
</script>
</body>
</html>
